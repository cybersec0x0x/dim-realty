<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dim Realty — Співробітники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Співробітники</div>
      <div class="topbar-actions">
        <input class="filter-input" id="emp-search" placeholder="Пошук…" oninput="filterEmployees()" style="width:200px;min-width:0">
        <button class="btn btn-gold btn-sm admin-only" onclick="openModal()"><i class="fas fa-user-plus"></i> <span>Додати</span></button>
      </div>
    </header>

    <main class="page-content">
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Співробітник</th>
                <th>Роль</th>
                <th>Телефон</th>
                <th>Статус</th>
                <th>Дата реєстрації</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="employees-tbody">
              <tr><td colspan="6"><div class="loading-wrap"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="emp-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Новий співробітник</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="emp-form" onsubmit="saveEmployee(event)">
        <input type="hidden" id="emp-id">
        <div class="form-grid" style="gap:16px">
          <div class="form-group">
            <label class="form-label">Повне ім'я *</label>
            <input class="form-control" id="emp-name" placeholder="Іван Іваненко" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input class="form-control" id="emp-email" type="email" placeholder="ivan@dimrealty.ua" required>
          </div>
          <div class="form-group">
            <label class="form-label">Телефон</label>
            <input class="form-control" id="emp-phone" placeholder="+380 XX XXX XXXX">
          </div>
          <div class="form-group">
            <label class="form-label">Роль</label>
            <select class="form-control" id="emp-role">
              <option value="agent">Агент</option>
              <option value="admin">Адміністратор</option>
            </select>
          </div>
          <div class="form-group full">
            <label class="form-label" id="pwd-label">Пароль *</label>
            <input class="form-control" id="emp-password" type="password" minlength="6" autocomplete="new-password" placeholder="Мінімум 6 символів">
            <small class="text-muted" id="pwd-hint" style="display:none">Залиште порожнім, щоб не змінювати</small>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Скасувати</button>
      <button class="btn btn-primary" onclick="document.getElementById('emp-form').requestSubmit()" id="save-btn">
        <i class="fas fa-save"></i> Зберегти
      </button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="del-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Видалення співробітника</span>
      <button class="modal-close" onclick="closeDelModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-2)">Видалити <b id="del-name"></b>? Обліковий запис буде видалено безповоротно. Якщо потрібно лише закрити доступ — краще деактивуйте співробітника.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDelModal()">Скасувати</button>
      <button class="btn btn-danger" id="confirm-del-btn"><i class="fas fa-trash"></i> Видалити</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/employees.js"></script>
</body>
</html>
