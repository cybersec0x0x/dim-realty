<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dim Realty — Вхід</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-logo">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="56" height="56" rx="14" fill="#0D2137"/>
      <rect x="1" y="1" width="54" height="54" rx="13" stroke="#C8A951" stroke-width="1.5" fill="none" opacity="0.45"/>
      <rect x="36" y="9" width="6" height="15" rx="1" fill="#C8A951"/>
      <path d="M28 8L5 25L51 25Z" fill="#C8A951" fill-opacity="0.12"/>
      <polyline points="5,25 28,8 51,25" stroke="#C8A951" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
      <rect x="7" y="25" width="42" height="21" fill="none" stroke="#C8A951" stroke-width="2"/>
      <rect x="10" y="27" width="11" height="9" rx="1" fill="none" stroke="#C8A951" stroke-width="1.5"/>
      <line x1="15.5" y1="27" x2="15.5" y2="36" stroke="#C8A951" stroke-width="1" opacity="0.6"/>
      <line x1="10" y1="31.5" x2="21" y2="31.5" stroke="#C8A951" stroke-width="1" opacity="0.6"/>
      <rect x="35" y="27" width="11" height="9" rx="1" fill="none" stroke="#C8A951" stroke-width="1.5"/>
      <line x1="40.5" y1="27" x2="40.5" y2="36" stroke="#C8A951" stroke-width="1" opacity="0.6"/>
      <line x1="35" y1="31.5" x2="46" y2="31.5" stroke="#C8A951" stroke-width="1" opacity="0.6"/>
      <rect x="21" y="33" width="14" height="13" rx="2" fill="#C8A951"/>
      <circle cx="32" cy="40" r="1.2" fill="#0D2137"/>
    </svg>
    <div class="brand"><span>DIM</span> REALTY</div>
    <div class="tagline">Система управління нерухомістю</div>
  </div>

  <div class="auth-card">
    <div class="auth-title">Вхід до панелі</div>
    <div class="auth-sub">Введіть дані вашого облікового запису</div>

    <form class="auth-form active" id="login-form" onsubmit="doLogin(event)" style="padding-top:22px">
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label" for="login-email">Email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input id="login-email" type="email" name="email" placeholder="you@dimrealty.ua" required autocomplete="username" autofocus>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:8px">
        <label class="form-label" for="login-pass">Пароль</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input id="login-pass" type="password" name="password" placeholder="Введіть пароль" required autocomplete="current-password" style="padding-right:44px">
          <button type="button" id="toggle-pass" aria-label="Показати пароль" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;color:var(--muted);border-radius:8px"><i class="fas fa-eye" style="position:static;transform:none;pointer-events:none"></i></button>
        </div>
      </div>
      <div id="login-error" role="alert" style="color:var(--danger);background:var(--danger-bg);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0 4px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn" style="height:46px;margin-top:16px;font-size:15px">
        <i class="fas fa-sign-in-alt"></i> Увійти
      </button>
      <div class="auth-note">Немає облікового запису? Зверніться до адміністратора.</div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (localStorage.getItem('dr_token')) location.href = '/dashboard.html';

  document.getElementById('toggle-pass').onclick = () => {
    const i = document.getElementById('login-pass');
    const show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    document.querySelector('#toggle-pass i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  };

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    const fd = new FormData(e.target);
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вхід...';
    err.style.display = 'none';
    try {
      const data = await api.post('/auth/login', { email: fd.get('email'), password: fd.get('password') });
      localStorage.setItem('dr_token', data.token);
      localStorage.setItem('dr_user', JSON.stringify(data.user));
      location.href = '/dashboard.html';
    } catch (ex) {
      err.textContent = ex.message; err.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти';
    }
  }
</script>
</body>
</html>
