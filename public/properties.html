<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dim Realty — Об'єкти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Меню"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="page-title">Всі об'єкти</div>
      <div class="topbar-actions">
        <a href="property-form.html" class="btn btn-gold btn-sm"><i class="fas fa-plus"></i> <span>Додати об'єкт</span></a>
      </div>
    </header>

    <main class="page-content">
      <!-- Filters -->
      <div class="filter-bar">
        <div class="filter-row">
          <div class="search-field">
            <i class="fas fa-search"></i>
            <input class="filter-input" id="f-search" placeholder="Пошук: назва, адреса, район, телефон власника…" oninput="debounceFilter()">
          </div>
          <input class="filter-input" id="f-city" placeholder="Місто" style="min-width:140px;max-width:180px" oninput="debounceFilter()">
          <select class="filter-select" id="f-type" onchange="onTypeFilterChange()">
            <option value="">Всі типи</option>
            <option value="apartment">Квартири</option>
            <option value="house">Будинки</option>
            <option value="land">Ділянки</option>
          </select>
          <select class="filter-select" id="f-house-type" onchange="applyFilters()" style="display:none">
            <option value="">Всі види будинків</option>
            <option value="private">Приватний будинок</option>
            <option value="duplex">Дюплекс</option>
            <option value="townhouse">Таунхаус</option>
            <option value="part">Частина будинку</option>
          </select>
          <select class="filter-select" id="f-sort" onchange="applyFilters()">
            <option value="date_desc">Новіші першими</option>
            <option value="date_asc">Старіші першими</option>
            <option value="price_asc">Ціна: від низької</option>
            <option value="price_desc">Ціна: від високої</option>
            <option value="area_asc">Площа: від меншої</option>
            <option value="area_desc">Площа: від більшої</option>
          </select>
        </div>
        <div class="filter-row">
          <div class="segmented" id="f-status-seg" role="group" aria-label="Статус">
            <button type="button" data-status="" class="active">Всі</button>
            <button type="button" data-status="available"><span class="dot available"></span>Доступні</button>
            <button type="button" data-status="reserved"><span class="dot reserved"></span>Резерв</button>
            <button type="button" data-status="sold"><span class="dot sold"></span>Продані</button>
          </div>
          <div class="filter-spacer"></div>
          <span id="total-count" class="result-count"></span>
          <button class="btn btn-ghost btn-sm" id="reset-btn" onclick="resetFilters()" style="display:none"><i class="fas fa-times"></i> Скинути</button>
          <button class="btn btn-outline btn-sm" onclick="exportCSV()" title="Експорт у CSV (всі знайдені об'єкти)"><i class="fas fa-download"></i> CSV</button>
          <div style="display:flex;gap:6px">
            <button class="icon-btn" id="view-grid" title="Картки" onclick="setView('grid')"><i class="fas fa-th-large"></i></button>
            <button class="icon-btn" id="view-list" title="Таблиця" onclick="setView('list')"><i class="fas fa-list"></i></button>
          </div>
        </div>
      </div>

      <div id="properties-container"></div>
      <div id="pagination" class="pagination"></div>
    </main>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="delete-modal" data-backdrop-close>
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">Видалення об'єкта</span>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-2)">Видалити <b id="delete-name"></b>? Разом з об'єктом буде видалено всі його фото. Дію не можна скасувати.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">Скасувати</button>
      <button class="btn btn-danger" id="confirm-delete-btn"><i class="fas fa-trash"></i> Видалити</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detail-modal" data-backdrop-close>
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="detail-title">Деталі об'єкта</span>
      <button class="modal-close" onclick="closeDetail()" aria-label="Закрити">×</button>
    </div>
    <div class="detail-layout">
      <div class="detail-media"><div class="gallery" id="detail-gallery"></div></div>
      <div class="detail-info">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px" id="detail-badges"></div>
        <div class="detail-price" id="detail-price"></div>
        <div class="detail-ppm" id="detail-ppm"></div>
        <div class="detail-name" id="detail-name"></div>
        <div class="spec-grid" id="detail-specs"></div>
        <div class="detail-address" id="detail-address" style="display:none"></div>
        <div class="detail-desc" id="detail-desc"></div>
        <div class="detail-footer">
          <div class="detail-meta" id="detail-meta"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <select id="detail-status-sel" class="filter-select" onchange="quickStatus()" aria-label="Статус"></select>
            <a id="detail-edit-btn" href="#" class="btn btn-primary btn-sm"><i class="fas fa-edit"></i> Редагувати</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/lightbox.js"></script>
<script src="/js/properties.js"></script>
</body>
</html>
