<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dim Realty — Об'єкти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#0D2137"/><rect x="1" y="1" width="38" height="38" rx="7" stroke="#C8A951" stroke-width="1" fill="none" opacity="0.35"/><rect x="26" y="6" width="5" height="11" rx="0.5" fill="#C8A951"/><path d="M20 5L1 19L39 19Z" fill="#C8A951" fill-opacity="0.12"/><polyline points="1,19 20,5 39,19" stroke="#C8A951" stroke-width="2" stroke-linejoin="round" fill="none"/><rect x="3" y="19" width="34" height="16" fill="none" stroke="#C8A951" stroke-width="1.5"/><rect x="5" y="21" width="8" height="5" rx="0.5" fill="none" stroke="#C8A951" stroke-width="1.2"/><line x1="9" y1="21" x2="9" y2="26" stroke="#C8A951" stroke-width="0.8" opacity="0.6"/><line x1="5" y1="23.5" x2="13" y2="23.5" stroke="#C8A951" stroke-width="0.8" opacity="0.6"/><rect x="27" y="21" width="8" height="5" rx="0.5" fill="none" stroke="#C8A951" stroke-width="1.2"/><line x1="31" y1="21" x2="31" y2="26" stroke="#C8A951" stroke-width="0.8" opacity="0.6"/><line x1="27" y1="23.5" x2="35" y2="23.5" stroke="#C8A951" stroke-width="0.8" opacity="0.6"/><rect x="15" y="26" width="10" height="9" rx="1" fill="#C8A951"/><circle cx="23" cy="31" r="0.9" fill="#0D2137"/></svg>
      <div class="brand-text"><div class="name"><span>DIM</span> REALTY</div><div class="sub">Admin Panel</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Головне</div>
      <a href="dashboard.html" class="nav-item" data-page="dashboard"><i class="fas fa-chart-pie"></i> Дашборд</a>
      <div class="nav-section-label">Нерухомість</div>
      <a href="properties.html?type=apartment" class="nav-item" data-page="apartments"><i class="fas fa-building"></i> Квартири</a>
      <a href="properties.html?type=house" class="nav-item" data-page="houses"><i class="fas fa-home"></i> Будинки</a>
      <a href="properties.html?type=land" class="nav-item" data-page="land"><i class="fas fa-tree"></i> Ділянки</a>
      <a href="properties.html" class="nav-item" data-page="properties"><i class="fas fa-list"></i> Всі об'єкти</a>
      <div class="nav-section-label admin-only">Адміністрування</div>
      <a href="employees.html" class="nav-item admin-only" data-page="employees"><i class="fas fa-users"></i> Співробітники</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar-sm" id="sidebar-avatar"></div>
      <div class="sidebar-user-info">
        <div class="uname" id="sidebar-user-name">Завантаження...</div>
        <div class="urole" id="sidebar-user-role"></div>
      </div>
      <button class="sidebar-logout" onclick="logout()" title="Вийти"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="page-title">Всі об'єкти</div>
      <div class="topbar-actions">
        <a href="property-form.html" class="btn btn-gold btn-sm"><i class="fas fa-plus"></i> Додати об'єкт</a>
      </div>
    </header>

    <main class="page-content">
      <!-- Filters -->
      <div class="filter-bar">
        <select class="filter-select" id="f-type" onchange="onTypeFilterChange()">
          <option value="">Всі типи</option>
          <option value="apartment">🏢 Квартири</option>
          <option value="house">🏠 Будинки</option>
          <option value="land">🌿 Ділянки</option>
        </select>
        <select class="filter-select" id="f-house-type" onchange="applyFilters()" style="display:none">
          <option value="">Всі будинки</option>
          <option value="private">🏠 Приватний будинок</option>
          <option value="duplex">🏘 Дюплекс</option>
          <option value="townhouse">🏙 Таунхаус</option>
          <option value="part">🏠 Частина будинку</option>
        </select>
        <select class="filter-select" id="f-status" onchange="applyFilters()">
          <option value="">Всі статуси</option>
          <option value="available">Доступні</option>
          <option value="sold">Продані</option>
          <option value="reserved">Зарезервовані</option>
        </select>
        <input class="filter-input" id="f-city" placeholder="Місто..." oninput="debounceFilter()">
        <input class="filter-input" id="f-search" placeholder="Пошук за назвою, адресою..." oninput="debounceFilter()">
        <select class="filter-select" id="f-sort" onchange="applyFilters()">
          <option value="date_desc">Новіші першими</option>
          <option value="date_asc">Старіші першими</option>
          <option value="price_asc">Ціна: від низької</option>
          <option value="price_desc">Ціна: від високої</option>
          <option value="area_asc">Площа: від меншої</option>
          <option value="area_desc">Площа: від більшої</option>
        </select>
        <div class="filter-spacer"></div>
        <span id="total-count" class="text-muted" style="font-size:13px;white-space:nowrap"></span>
        <button class="btn btn-outline btn-sm" onclick="exportCSV()" title="Експорт CSV"><i class="fas fa-download"></i> CSV</button>
        <div style="display:flex;gap:6px">
          <button class="icon-btn" id="view-grid" title="Сітка" onclick="setView('grid')"><i class="fas fa-th-large"></i></button>
          <button class="icon-btn" id="view-list" title="Список" onclick="setView('list')"><i class="fas fa-list"></i></button>
        </div>
      </div>

      <div id="properties-container"><div class="loading-wrap"><div class="spinner"></div></div></div>
      <div id="pagination" class="pagination"></div>
    </main>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Видалення об'єкта</span>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-2)">Ви впевнені, що хочете видалити цей об'єкт? Дія незворотна.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">Скасувати</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Видалити</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:700px;width:100%">
    <div class="modal-header">
      <span class="modal-title" id="detail-title">Деталі об'єкта</span>
      <button class="modal-close" onclick="document.getElementById('detail-modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body" style="padding:0">
      <!-- Image gallery -->
      <div id="detail-gallery" style="background:#0D2137;height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden"></div>
      <div style="padding:24px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px" id="detail-badges"></div>
        <div style="font-size:26px;font-weight:700;color:var(--primary);margin-bottom:4px" id="detail-price"></div>
        <div style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:16px" id="detail-name"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px" id="detail-specs"></div>
        <div id="detail-address" style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:14px"></div>
        <div id="detail-desc" style="color:var(--text-2);font-size:14px;line-height:1.7;margin-bottom:14px"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)">
          <div style="font-size:12px;color:var(--muted)" id="detail-meta"></div>
          <div style="display:flex;gap:8px">
            <select id="detail-status-sel" class="filter-select" style="font-size:13px" onchange="quickStatus()"></select>
            <a id="detail-edit-btn" href="#" class="btn btn-primary btn-sm"><i class="fas fa-edit"></i> Редагувати</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/properties.js"></script>
</body>
</html>
